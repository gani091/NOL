<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>놀꼬지 AS-IS Prototype</title>
<style>
:root{
  --green:#31ad4b;
  --green-dark:#238b39;
  --green-soft:#edf9f0;
  --green-line:#64c775;
  --yellow:#ffc957;
  --orange:#ff7a23;
  --text:#171717;
  --sub:#7d8490;
  --line:#e6e8ec;
  --panel:#f8f9fb;
  --danger:#e34d4d;
}
*{box-sizing:border-box}
html,body{margin:0;background:#ececec;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;color:var(--text)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
#app{width:min(100vw,430px);min-height:100vh;margin:0 auto;background:#fff;position:relative;padding-bottom:84px;overflow-x:hidden}
.statusbar{height:44px;padding:10px 18px 0;display:flex;justify-content:space-between;font-weight:800;font-size:14px;background:#fff}
.statusbar .right{display:flex;gap:7px;align-items:center}
.battery{background:#5bc55f;color:#fff;border-radius:5px;padding:1px 5px;font-size:12px}
.header{height:58px;padding:0 16px;display:flex;align-items:center;justify-content:center;position:relative;background:#fff}
.header h1{font-size:20px;margin:0;font-weight:800}
.icon-btn{position:absolute;width:42px;height:42px;border-radius:50%;border:none;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center}
.icon-btn.left{left:12px}
.header-actions{position:absolute;right:14px;display:flex;gap:6px}
.header-actions .mini{width:34px;height:34px;border-radius:50%;border:0;background:#fff;box-shadow:0 7px 22px rgba(0,0,0,.08);font-size:18px}
.badge{position:absolute;min-width:18px;height:18px;border-radius:9px;background:#ef4c4c;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;top:-4px;right:-4px}
.screen{padding:0 16px 22px}
.home-hero{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:stretch;margin-top:8px}
.insta-card{border-radius:14px;background:linear-gradient(145deg,#7048ff,#d42d93 45%,#ff8b33);min-height:116px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:44px;font-weight:800}
.hero-banner{border-radius:18px;background:#2ea849;min-height:116px;color:#ffd234;padding:22px 18px;font-size:27px;line-height:1.05;font-weight:900}
.section-title{font-size:19px;font-weight:900;margin:22px 0 12px}
.green-title{color:var(--green)}
.rank-card,.soft-card,.outline-card,.white-card{border-radius:15px}
.rank-card{border:1.5px solid var(--green);padding:14px 16px;background:#fff}
.rank-title{text-align:center;color:var(--green);font-size:16px;font-weight:900;margin-bottom:12px}
.rank-row{display:flex;justify-content:space-between;font-size:15px;line-height:1.45}
.rank-name{display:flex;align-items:center;gap:5px}
.dots{display:flex;justify-content:center;gap:6px;padding-top:9px}
.dot{width:7px;height:7px;border-radius:50%;background:#d3d8df}
.dot.active{background:var(--green)}
.soft-card{background:var(--green-soft);border:1.5px solid var(--green);padding:18px}
.score-head{text-align:center;font-size:22px;font-weight:900;margin-bottom:14px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metric{background:#fff;border:1px solid #e8e9ec;border-radius:15px;text-align:center;padding:14px 6px}
.metric small{color:var(--sub);display:block;margin-bottom:8px}
.metric strong{font-size:20px}
.empty-card{background:var(--green-soft);border:1.5px solid var(--green);border-radius:15px;text-align:center;padding:26px 16px}
.primary,.secondary,.yellow,.ghost,.danger-outline{height:48px;border-radius:12px;font-weight:800;border:none}
.primary{background:var(--green);color:#fff}
.secondary{background:#fff;color:var(--green);border:1.5px solid var(--green)}
.yellow{background:var(--yellow);color:#111}
.ghost{background:#fff;color:#222;border:1px solid var(--line)}
.danger-outline{background:#fff;color:var(--danger);border:1px solid #ef9d9d}
.btn-small{height:38px;padding:0 18px;border-radius:20px}
.activity-card{border:1px solid #e0e3e7;border-radius:15px;padding:15px;margin-bottom:12px;background:#fff}
.activity-card h3{margin:4px 0 8px;font-size:18px}
.muted{color:var(--sub);font-size:13px;line-height:1.6}
.tag{display:inline-block;padding:4px 10px;border-radius:13px;background:#eff9f1;color:var(--green);font-size:12px;font-weight:800;border:1px solid #b8e6bf}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100vw,430px);height:72px;background:#fff;border-top:1px solid #edf0f3;display:grid;grid-template-columns:repeat(4,1fr);z-index:20}
.tabbar button{border:0;background:#fff;color:#9aa1ad;font-size:11px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px}
.tabbar button.active{color:var(--green);font-weight:800}
.tab-icon{font-size:22px}
.segment{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--green);border-radius:14px;overflow:hidden;margin:14px 0}
.segment button{height:44px;border:0;background:#fff;color:var(--green);font-weight:800}
.segment button.active{background:var(--green);color:#fff}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:18px;padding:7px 12px;font-size:12px}
.chip.active{background:#ecf8ef;color:var(--green);border-color:#9ed6aa;font-weight:800}
.search{height:42px;width:100%;border:0;border-radius:10px;background:#f2f3f6;padding:0 13px;margin:8px 0 10px}
.list-card{display:flex;gap:12px;border-bottom:1px solid #f0f1f3;padding:14px 0;align-items:center}
.thumb{width:74px;height:74px;border-radius:13px;background:#eef0f2;display:flex;align-items:center;justify-content:center;font-size:28px;flex:none;overflow:hidden}
.thumb.tennis{background:radial-gradient(circle at 50% 40%,#d4efc5 0 34%,#7cb859 35% 36%,#f7f7e9 37% 100%)}
.thumb.blue{background:#3153a4;color:#ffbf41;font-weight:900}
.list-card .body{flex:1}
.list-card h3{font-size:16px;margin:0 0 6px}
.fab{position:fixed;right:calc(50% - min(50vw,215px) + 18px);bottom:88px;width:54px;height:54px;border-radius:50%;border:0;background:var(--orange);color:#fff;font-size:30px;box-shadow:0 10px 24px rgba(0,0,0,.18);z-index:18}
.hero-image{height:215px;margin:0 -16px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:900;color:#fff}
.hero-image.green{background:#28a949}
.hero-image.blue{background:#3859ae}
.detail-title{font-size:23px;font-weight:900;margin:8px 0 4px}
.detail-sub{color:#616876;font-size:14px;line-height:1.5}
.location{margin:16px 0;font-size:14px}
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.info-section{padding:18px 0;border-top:12px solid #f6f7f9;margin:0 -16px}
.info-section .inner{padding:0 16px}
.info-section h3{margin:0 0 12px;font-size:17px}
.info-section p,.info-section li{font-size:14px;line-height:1.6}
.inquiry{margin:18px 0 4px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.inquiry button{border:0;background:#f7f7f8;border-radius:20px;padding:10px 15px;color:#7f8590}
.form-title{font-size:18px;font-weight:900;margin:18px 0 8px}
.field{margin:14px 0}
.field label{display:block;font-size:13px;font-weight:800;margin-bottom:8px}
.field input,.field textarea,.field select{width:100%;border:1px solid #e6e8eb;border-radius:12px;background:#fff;padding:13px 12px;outline:none}
.field textarea{min-height:110px;resize:vertical}
.option-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.option{border:1px solid #e6e8eb;border-radius:12px;padding:12px 6px;text-align:center;background:#fff}
.option.active{border-color:var(--green);background:#eff9f1;color:var(--green);font-weight:800}
.switch-row{border:1px solid #e8eaed;border-radius:13px;padding:14px 12px;display:flex;justify-content:space-between;align-items:center;margin:12px 0}
.switch{width:56px;height:30px;border-radius:15px;background:#b9bdc3;position:relative;border:0}
.switch::after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;top:3px;left:4px;transition:.2s}
.switch.on{background:var(--green)}
.switch.on::after{left:28px}
.step-icons{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:18px 0}
.sport{aspect-ratio:1;border:1px solid #e6e8eb;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px}
.sport small{font-size:11px;margin-top:4px}
.sport.active{border-color:var(--green);box-shadow:0 0 0 2px #e7f7ea inset}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}
.pill{border:1px solid #e5e7ea;background:#fff;border-radius:18px;padding:8px 12px;font-size:12px}
.pill.active{background:var(--green);color:#fff;border-color:var(--green)}
.calendar{border:1px solid #ededed;border-radius:14px;padding:14px}
.cal-head{display:flex;justify-content:space-between;font-weight:800;margin-bottom:16px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center;font-size:12px;color:#9ca2ab}
.cal-grid .day{padding:7px 0;border-radius:50%}
.cal-grid .selected{background:#daf3df;color:var(--green);font-weight:900}
.subtabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #eee;margin:0 -16px 14px}
.subtabs button{height:44px;border:0;background:#fff;color:#8d929a}
.subtabs button.active{color:var(--green);border-bottom:2px solid var(--green);font-weight:800}
.approval-summary{background:#eff9f1;padding:10px 12px;margin:0 -16px 12px;color:#46614b;font-size:13px}
.person-card{border:1px solid #e9eaec;border-radius:13px;padding:13px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.person-info{display:flex;gap:10px;align-items:center}
.avatar{width:42px;height:42px;border-radius:50%;background:#e9f7ec;color:var(--green);display:flex;align-items:center;justify-content:center;font-weight:900}
.dm-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #f1f2f4}
.dm-item .body{flex:1}
.dm-item h4{margin:0 0 4px;font-size:15px}
.dm-item time{font-size:11px;color:#a0a5ad}
.chat{padding-bottom:86px}
.chat-date{text-align:center;margin:12px 0;color:#8b9098;font-size:12px}
.bubble-row{display:flex;margin:12px 0}
.bubble-row.me{justify-content:flex-end}
.bubble{max-width:72%;border-radius:16px;padding:10px 12px;font-size:13px;line-height:1.5;background:#f2f3f5}
.bubble-row.me .bubble{background:#e9e9e9}
.chat-input{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100vw,430px);height:64px;background:#fff;border-top:1px solid #eee;display:flex;gap:8px;padding:10px 12px;z-index:21}
.chat-input input{flex:1;border:1px solid #e5e7ea;border-radius:20px;padding:0 14px}
.chat-input button{width:42px;border:0;background:#fff;font-size:22px;color:#a0a4ac}
.notice{background:#eff9f1;border-radius:12px;padding:13px;margin-bottom:10px;display:flex;gap:10px}
.notice.unread{background:#e9f8ed}
.notice .dotmark{width:8px;height:8px;border-radius:50%;background:var(--green);margin-top:6px}
.settings-card{background:#eff9f1;border:1px solid #9bd4a7;border-radius:14px;padding:13px;margin-bottom:18px}
.settings-row{height:52px;border-bottom:1px solid #f0f1f3;display:flex;align-items:center;justify-content:space-between;font-size:14px}
.toggle-inline{width:42px;height:24px;border-radius:12px;background:var(--green);position:relative}
.toggle-inline::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;right:2px;top:2px;background:#fff}
.summary-box{border:1.5px solid var(--green);background:#eff9f1;border-radius:14px;padding:14px;margin:12px 0}
.summary-title{display:flex;justify-content:space-between;align-items:center}
.leader-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.top-filter{display:flex;gap:8px;margin:12px 0}
.top-filter button{border:1px solid #e4e6e9;background:#fff;border-radius:16px;padding:7px 12px;font-size:12px}
.top-filter button.active{background:var(--green);color:#fff;border-color:var(--green)}
.hidden{display:none!important}
@media(max-width:430px){html,body{background:#fff}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const state={
  route:'home',
  activeTab:'home',
  rankMode:'group',
  guestAllowed:false,
  joinAuto:false,
  sport:'테니스',
  selectedGroup:'라켓헌터스',
  selectedGroupRole:'member',
  dmTab:'member',
  manageTab:'activity',
  activityDetailTab:'detail',
  activityFilter:'전체'
};
const groups=[
  {name:'놀꼬지 텐션업',sport:'테니스',desc:'회사에서 떨어진 텐션 퇴근하고 함께 끌어 올려요~ 🔥',place:'올림픽공원 테니스장',guest:true,thumb:'tennis'},
  {name:'놀꼬지 핑퐁',sport:'탁구',desc:'놀꼬지 공식 모꼬지로 다양한 이벤트/행사용 모꼬지 입니다.',place:'올림픽공원 탁구 경기장',guest:true,thumb:'green'},
  {name:'라켓헌터스',sport:'테니스',desc:'강동, 송파 테니스 모임',place:'강동 해비치',guest:false,thumb:'blue'},
  {name:'놀꼬지 Luv',sport:'테니스',desc:'주말 오후 함께 즐겨요.',place:'송파구 테니스장',guest:true,thumb:'tennis'}
];
const activities=[
 {title:'놀꼬지 텐션업',date:'2026.08.10',time:'17:00 ~ 18:00',place:'올림픽공원 테니스장',status:'활동 예정'},
 {title:'놀꼬지 텐션업',date:'2026.08.10',time:'17:00 ~ 18:00',place:'올림픽공원 테니스장',status:'활동 예정'}
];
const rankings={
 group:[['라켓헌터스',50],['놀꼬지 핑퐁',12],['놀꼬지 텐션업',12],['놀꼬지 INdoor',12],['놀꼬지 Luv',10]],
 member:[['놀꼬지',20],['쿠크다스',16],['모꼬',10],['이상헌',10],['MINJI',10]]
};
const icons={home:'⌂',group:'♧',activity:'▦',dm:'◯'};
let rankTimer;

function statusbar(){
 return `<div class="statusbar"><span>${new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false})}</span><span class="right">▮▮▮ 5G <span class="battery">99%</span></span></div>`;
}
function header(title='',opts={}){
 return `${statusbar()}<div class="header">
 ${opts.back?`<button class="icon-btn left" onclick="back()">‹</button>`:''}
 <h1>${title}</h1>
 ${opts.actions!==false?`<div class="header-actions"><button class="mini" onclick="go('notifications')" style="position:relative">🔔<span class="badge">13</span></button><button class="mini" onclick="go('settings')">⚙</button></div>`:''}
 </div>`;
}
function tabbar(active=state.activeTab){
 const items=[['home','메인','home'],['group','모꼬지','group-home'],['activity','내 활동','my-activity'],['dm','DM','dm']];
 return `<nav class="tabbar">${items.map(([key,label,route])=>`<button class="${active===key?'active':''}" onclick="go('${route}')"><span class="tab-icon">${icons[key]}</span>${label}</button>`).join('')}</nav>`;
}
function setActiveForRoute(route){
 if(route.startsWith('group')||['exchange-list','exchange-detail','exchange-create','create-group','activity-apply','join'].includes(route)) state.activeTab='group';
 else if(route.startsWith('my-')||route.startsWith('manage')||route.startsWith('activity-detail')||route==='activity-register'||route==='activity-all') state.activeTab='activity';
 else if(route.startsWith('dm')||route==='chat') state.activeTab='dm';
 else state.activeTab='home';
}
function go(route,params={}){
 Object.assign(state,params); state.route=route; setActiveForRoute(route); render(); window.scrollTo(0,0);
}
function back(){history.length>1?history.back():go('home')}
window.addEventListener('popstate',()=>{
 const route=(location.hash||'#home').slice(1);
 state.route=route||'home';
 setActiveForRoute(state.route);
 render(false);
});
function rankCard(){
 const list=rankings[state.rankMode];
 const title=state.rankMode==='group'?'모꼬지 랭킹':'모꼬 랭킹';
 return `<div class="rank-card" onclick="toggleRank()"><div class="rank-title">${title}</div>${list.map((r,i)=>`<div class="rank-row"><span class="rank-name">${i<4?'🏆':(i+1)+'위'} ${r[0]}</span><span>${r[1]}점</span></div>`).join('')}</div>
 <div class="dots"><span class="dot ${state.rankMode==='member'?'active':''}"></span><span class="dot ${state.rankMode==='group'?'active':''}"></span></div>`;
}
function toggleRank(){state.rankMode=state.rankMode==='group'?'member':'group';render(false)}
function startRankRotation(){
 clearInterval(rankTimer);
 if(state.route==='home') rankTimer=setInterval(()=>{state.rankMode=state.rankMode==='group'?'member':'group';render(false)},3000);
}
function home(){
 return `${header('',{back:false})}<main class="screen">
 <div class="home-hero"><div class="insta-card">◎</div><div class="hero-banner">다양한 소식은<br>공식 계정에서</div></div>
 <div class="section-title">활동 랭킹</div>${rankCard()}
 <div class="section-title green-title">신가은님의 활동 랭킹</div>
 <div class="soft-card"><div class="score-head">6위 6점</div><div class="metrics">
 <div class="metric"><small>활동 참여</small><strong>2</strong></div><div class="metric"><small>이벤트 참여</small><strong>-</strong></div><div class="metric"><small>노쇼</small><strong>-</strong></div></div></div>
 <div class="section-title green-title">참여 예정된 활동이 있어요</div>
 <div class="activity-card" onclick="go('activity-detail')"><h3>놀꼬지 텐션업</h3><div class="muted">2026.08.10 (월) · 17:00 ~ 18:00<br>⌖ 올림픽공원 테니스장</div></div>
 </main>${tabbar('home')}`;
}
function notifications(){
 const rows=['놀꼬지 텐션업 2026.08.10 활동 신청이 승인되었습니다! 🎉','놀꼬지 텐션업 2026.08.10 활동 신청이 승인되었습니다! 🎉','신가은님이 놀꼬지 텐션업 활동을 신청했습니다.','신가은님이 놀꼬지 텐션업 활동을 신청했습니다.','놀꼬지님이 메시지를 보냈습니다.'];
 return `${header('알림',{back:true,actions:false})}<main class="screen"><div style="display:flex;justify-content:space-between;margin:8px 0 14px"><b>알림 <span class="tag">6</span></b><span class="green-title">전체 읽음</span></div>${rows.map((x,i)=>`<div class="notice ${i<4?'unread':''}" onclick="${i===4?"go('chat')":"go('activity-detail')"}"><span>🔔</span><div style="flex:1;font-size:13px;line-height:1.5">${x}<div class="muted">${i+1}분 전</div></div>${i<4?'<span class="dotmark"></span>':''}</div>`).join('')}</main>${tabbar('home')}`;
}
function settings(){
 return `${header('설정',{back:true,actions:false})}<main class="screen">
 <div class="settings-card"><div style="color:var(--green);font-size:12px">신가은</div><div class="muted">서울특별시 구로구</div><button class="ghost" style="width:100%;margin-top:10px" onclick="go('profile')">내 정보 수정</button></div>
 ${['공지사항','FAQ / 운영 정책'].map(x=>`<div class="settings-row"><span>${x}</span><span>›</span></div>`).join('')}
 <div class="settings-row"><span>PUSH 알림 수신 설정</span><span class="toggle-inline"></span></div>
 <div class="settings-row"><span>로그아웃</span></div><div class="settings-row" style="color:#ef7070"><span>회원 탈퇴</span></div>
 </main>${tabbar('home')}`;
}
function profile(){
 return `${header('정보 수정',{back:true,actions:false})}<main class="screen">
 ${field('이름','신가은')}<div class="field"><label>성별</label><div class="action-grid"><button class="ghost">남자</button><button class="secondary">여자</button></div></div>
 ${field('활동 지역','서울특별시 구로구')}

 return `${header(state.dmTab==='group'?'놀꼬지 텐션업':'놀꼬지',{back:true,actions:false})}<main class="screen chat"><div class="chat-date">2026년 7월 20일</div><div class="bubble-row"><div class="bubble">안녕하세요, 활동비가 별도 문의로 되어있던데, 얼마인가요?</div></div><div class="bubble-row me"><div class="bubble">안녕하세요! 테니스공 이용료 및 제공비까지 25,000원 입니다. 인원은 당일 모꼬로 받을게요</div></div><div class="bubble-row"><div class="bubble">신청했는데 승인 부탁드립니다.</div></div><div class="bubble-row me"><div class="bubble">20일에 뵙겠습니다🙂</div></div></main><div class="chat-input"><button>▧</button><input placeholder="메시지를 입력하세요"><button>➤</button></div>`;
}
function render(push=true){
 const app=document.getElementById('app');
 const views={home,notifications,settings,profile,'group-home':groupHome,'group-list':groupList,'group-detail':groupDetail,'exchange-list':exchangeList,'exchange-detail':exchangeDetail,'exchange-create':exchangeCreate,join,'create-group':createGroup,'activity-register':activityRegister,'activity-apply':activityApply,'my-activity':myActivity,'my-leader':myLeader,'activity-all':activityAll,manage,'activity-detail':activityDetail,dm,chat};
 app.innerHTML=(views[state.route]||home)();
 if(push){history.pushState({route:state.route},'',`#${state.route}`)}
 startRankRotation();
}
render(false);
</script>
