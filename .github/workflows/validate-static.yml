name: Validate prototype

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app-core.js
          node --check app-flow.js
          node --check app-v2.js
          node --check app-v3.js
          node --check app-v4.js
          node --check app-v5.js
          node --check app-v5-score-fix.js
      - name: Check entrypoint references
        run: |
          grep -q 'flow-v2.css' index.html
          grep -q 'flow-v3.css' index.html
          grep -q 'flow-v4.css' index.html
          grep -q 'flow-v5.css' index.html
          grep -q 'app-v2.js' index.html
          grep -q 'app-v3.js' index.html
          grep -q 'app-v4.js' index.html
          grep -q 'app-v5.js' index.html
          grep -q 'app-v5-score-fix.js' index.html